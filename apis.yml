name: Mobileum
description: >-
  Mobileum is a telecom analytics and intelligence software vendor whose Active
  Intelligence Platform delivers AI-powered decisioning, risk management, and
  network insight for mobile network operators. Its product families span roaming
  management (traffic steering, GlobalRoamer, campaign management), risk management
  (revenue assurance and fraud detection via RAID), network security (cross-protocol
  signaling firewalls and SMS/voice protection), testing and service assurance (5G,
  eSIM, IoT, VoLTE testing, dsTest), customer experience, and data insights and
  monetization. Mobileum sells primarily to carriers as deployed/managed enterprise
  software and does not publish a public developer portal or open API surface.
